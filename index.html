<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, responsive emoji picker with multiple themes and emoji sets support.">
    <title>Kenig Emoji Picker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- Emoji Picker Panel -->
        <div class="picker" id="emoji-picker">
            <div id="loader">
                <div class="spinner"></div>
                <div>Loading v17.0 Stable...</div>
            </div>

            <!-- Navigation Tabs -->
            <div class="nav" id="cat-nav">
                <button class="nav-btn active" data-group="recent" title="Recent" aria-label="Recently used emojis">
                    <span class="material-symbols-outlined">schedule</span>
                </button>
                <button class="nav-btn" data-group="0" title="Smileys" aria-label="Smileys and emotions">
                    <span class="material-symbols-outlined">sentiment_satisfied</span>
                </button>
                <button class="nav-btn" data-group="1" title="People" aria-label="People">
                    <span class="material-symbols-outlined">emoji_people</span>
                </button>
                <button class="nav-btn" data-group="3" title="Nature" aria-label="Animals and nature">
                    <span class="material-symbols-outlined">emoji_nature</span>
                </button>
                <button class="nav-btn" data-group="4" title="Food" aria-label="Food and drink">
                    <span class="material-symbols-outlined">emoji_food_beverage</span>
                </button>
                <button class="nav-btn" data-group="6" title="Events" aria-label="Activities and events">
                    <span class="material-symbols-outlined">emoji_events</span>
                </button>
                <button class="nav-btn" data-group="5" title="Travel" aria-label="Travel and places">
                    <span class="material-symbols-outlined">emoji_transportation</span>
                </button>
                <button class="nav-btn" data-group="7" title="Objects" aria-label="Objects">
                    <span class="material-symbols-outlined">emoji_objects</span>
                </button>
                <button class="nav-btn" data-group="8" title="Symbols" aria-label="Symbols">
                    <span class="material-symbols-outlined">emoji_symbols</span>
                </button>
                <button class="nav-btn" data-group="9" title="Flags" aria-label="Flags">
                    <span class="material-symbols-outlined">flag</span>
                </button>
            </div>

            <!-- Search Box -->
            <div class="search-area">
                <div class="search-box">
                    <span class="material-symbols-outlined search-icon" style="font-variation-settings:'FILL' 0">search</span>
                    <input type="text" id="search" placeholder="Search emojis..." aria-label="Search emojis">
                </div>
            </div>

            <!-- Emoji Viewport -->
            <div class="viewport" id="viewport">
                <div id="section-recent">
                    <div class="section-title" id="title-recent">Frequently used</div>
                    <div class="emoji-grid" id="grid-recent"></div>
                </div>
                <div id="main-groups"></div>
            </div>

            <!-- Footer with Preview and Skin Selector -->
            <div class="footer" id="picker-footer">
                <div id="preview-char">✨</div>
                <div id="preview-name">Select an emoji</div>
                <div id="skin-trigger" class="skin-trigger" title="Select skin tone" aria-label="Skin tone selector"></div>
                <div id="skin-menu" class="skin-menu" role="menu">
                    <div class="skin-opt" data-idx="0" role="menuitem"><img alt=""> <span>Default</span></div>
                    <div class="skin-opt" data-idx="1" role="menuitem"><img alt=""> <span>Light</span></div>
                    <div class="skin-opt" data-idx="2" role="menuitem"><img alt=""> <span>Medium-Light</span></div>
                    <div class="skin-opt" data-idx="3" role="menuitem"><img alt=""> <span>Medium</span></div>
                    <div class="skin-opt" data-idx="4" role="menuitem"><img alt=""> <span>Medium-Dark</span></div>
                    <div class="skin-opt" data-idx="5" role="menuitem"><img alt=""> <span>Dark</span></div>
                </div>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <div class="setting-row">
                <span class="setting-label" id="lbl-set">Set:</span>
                <select id="set-select" aria-label="Emoji set">
                    <option value="native">Native</option>
                    <option value="openmoji">OpenMoji</option>
                    <option value="google">Google</option>
                    <option value="twemoji">Twemoji</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label" id="lbl-color">Color:</span>
                <select id="color-select" aria-label="Color mode">
                    <option value="color">Color</option>
                    <option value="black">Black</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label" id="lbl-theme">Theme:</span>
                <select id="theme-select" aria-label="Theme">
                    <option value="auto">Auto</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label" id="lbl-icons">Icons:</span>
                <select id="icon-style-select" aria-label="Icon style">
                    <option value="auto">Auto</option>
                    <option value="1">Filled</option>
                    <option value="0">Outlined</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label" id="lbl-version">Emoji version:</span>
                <select aria-label="Emoji version" disabled>
                    <option>17.0 (Stable)</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label" id="lbl-locale">Locale (UI):</span>
                <select id="locale-select" class="bg-teal" aria-label="UI language">
                    <option value="en">English (en)</option>
                    <option value="pl">Polski (pl)</option>
                    <option value="fr">French (fr)</option>
                    <option value="de">German (de)</option>
                    <option value="it">Italian (it)</option>
                </select>
            </div>

            <button class="broom-btn" id="clear-history" title="Clear recent history" aria-label="Clear recent emoji history">
                <img src="https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/72x72/1F9F9.png" alt="">
                Clear History
            </button>

            <div class="attribution">Created by AI Agent</div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="script.js" defer></script>
</body>
</html>
